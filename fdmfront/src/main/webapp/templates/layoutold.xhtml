<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <f:facet name="first">
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
    </f:facet>
    <title>Fossa das Marianas - <ui:insert name="titulo">Moda praiana</ui:insert></title>
    <h:outputStylesheet name="css/fdm.css"/>
</h:head>

<h:body>
    <p:growl id="growl" showDetail="true" life="6000"/>

    <h:form id="formMenu">
        <p:menubar styleClass="fdm-menu">
            <p:menuitem value="Fossa das Marianas" outcome="/index" icon="pi pi-compass"/>
            <p:menuitem value="Vitrine" outcome="/index" icon="pi pi-home"/>
            <p:menuitem value="Buscar" outcome="/busca" icon="pi pi-search"/>
            <p:menuitem value="Entrar" outcome="/login" icon="pi pi-sign-in"
                        rendered="#{not sessaoCtrl.logado}"/>
            <p:menuitem value="Criar conta" outcome="/cadastro" icon="pi pi-user-plus"
                        rendered="#{not sessaoCtrl.logado}"/>
            <p:menuitem value="Meus pedidos" outcome="/pedidos" icon="pi pi-list"
                        rendered="#{sessaoCtrl.logado}"/>
            <p:submenu label="Administração" icon="pi pi-cog" rendered="#{sessaoCtrl.admin}">
                <p:menuitem value="Categorias" outcome="/admin/categorias" icon="pi pi-tags"/>
                <p:menuitem value="Produtos" outcome="/admin/produtos" icon="pi pi-box"/>
                <p:menuitem value="SKUs" outcome="/admin/skus" icon="pi pi-barcode"/>
                <p:menuitem value="Solicitações" outcome="/admin/solicitacoes" icon="pi pi-inbox"/>
                <p:menuitem value="Cadastros" outcome="/admin/cadastros" icon="pi pi-users"/>
            </p:submenu>
            <f:facet name="options">
                <h:outputText value="Olá, #{sessaoCtrl.nomeUsuario} " styleClass="fdm-saudacao"
                              rendered="#{sessaoCtrl.logado}"/>
                <p:commandButton value="Sair" icon="pi pi-sign-out" action="#{sessaoCtrl.sair}"
                                 ajax="false" styleClass="ui-button-flat" rendered="#{sessaoCtrl.logado}"/>
                <p:button outcome="/carrinho" icon="pi pi-shopping-cart"
                          value="Carrinho"/>
            </f:facet>
        </p:menubar>
    </h:form>

    <main class="fdm-conteudo">
        <ui:insert name="conteudo"/>
    </main>

    <footer class="fdm-rodape">
        Fossa das Marianas &#169; Moda praiana para mergulhar fundo no verão.
    </footer>

    <!-- balaozinho do adm -->
    <p:outputPanel layout="block" styleClass="fdm-dock" rendered="#{sessaoCtrl.admin}">
        <span class="fdm-dock-titulo">Admin</span>
        <p:button outcome="/admin/produtos" icon="pi pi-box" title="Adicionar produto"
                  styleClass="ui-button-rounded">
            <f:param name="acao" value="novo"/>
        </p:button>
        <p:button outcome="/admin/skus" icon="pi pi-barcode" title="Adicionar SKU"
                  styleClass="ui-button-rounded">
            <f:param name="acao" value="novo"/>
        </p:button>
        <p:button outcome="/admin/categorias" icon="pi pi-tags" title="Adicionar categoria"
                  styleClass="ui-button-rounded">
            <f:param name="acao" value="novo"/>
        </p:button>
        <p:button outcome="/admin/cadastros" icon="pi pi-user-plus" title="Adicionar cadastro"
                  styleClass="ui-button-rounded">
            <f:param name="acao" value="novo"/>
        </p:button>
        <p:button outcome="/admin/solicitacoes" icon="pi pi-inbox" title="Solicitações de cadastro"
                  styleClass="ui-button-rounded"/>
    </p:outputPanel>

    <h:form id="formConfirmacao">
        <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
            <p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check"/>
            <p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no ui-button-secondary"
                             icon="pi pi-times"/>
        </p:confirmDialog>
    </h:form>
</h:body>
</html>

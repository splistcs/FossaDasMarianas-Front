<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">

<h:head>
  <f:facet name="first">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
  </f:facet>
    
  <title>Fossa das Marianas - <ui:insert name="titulo">Moda praiana</ui:insert></title>
    
  <h:outputStylesheet name="css/fdm.css"/>
</h:head>

<h:body>
  <p:growl id="growl" showDetail="true" life="6000"/>

  <!-- cabeçalho -->
	<header class="fdm-header">
		<ui:include src="/header/Header.xhtml" />
	</header>	

  <!-- corpo - main... texto?  -->
	<main class="fdm-conteudo">			
	  <ui:insert name="conteudo" />
	</main>

  <!-- rodapé -->
  <footer class="fdm-rodape">
	  <ui:include src="/footer/Rodape.xhtml" />
  </footer>

  <!-- balaozinho do admin (SUDO POWER) -->
  <ui:include src="/admin/AdminBalao.xhtml" />
    
  <!-- pop up -->
  <h:form id="formConfirmacao">
    <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
      <p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check"/>
      <p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no ui-button-secondary" icon="pi pi-times"/>
    </p:confirmDialog>
  </h:form>
</h:body>

</html>

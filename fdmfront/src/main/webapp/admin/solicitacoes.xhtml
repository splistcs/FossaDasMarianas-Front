<ui:composition template="/templates/Layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">

    <ui:define name="titulo">Solicitações de cadastro</ui:define>

    <ui:define name="conteudo">
        <h1>Solicitações de cadastro</h1>

        <h:form id="formLista">
            <p:commandButton value="Atualizar" icon="pi pi-refresh" action="#{validarSolicitacaoCtrl.carregar}"
                             process="@this" update="tabela" styleClass="ui-button-secondary"/>

            <p:dataTable id="tabela" value="#{validarSolicitacaoCtrl.pendentes}" var="item"
                         styleClass="fdm-filtros" emptyMessage="Nenhuma solicitação pendente."
                         paginator="true" rows="10">
                <p:column headerText="Nome">
                    <h:outputText value="#{item.nomeCompleto}"/>
                </p:column>
                <p:column headerText="E-mail">
                    <h:outputText value="#{item.email}"/>
                </p:column>
                <p:column headerText="CPF">
                    <h:outputText value="#{item.cpf}"/>
                </p:column>
                <p:column headerText="Telefone">
                    <h:outputText value="#{item.telefone}"/>
                </p:column>
                <p:column headerText="Endereço">
                    <h:outputText value="#{item.enderecos[0].rua}, #{item.enderecos[0].numero} - #{item.enderecos[0].cidade}"
                                  rendered="#{not empty item.enderecos}"/>
                </p:column>
                <p:column headerText="Ações" style="width: 9rem; text-align: center">
                    <p:commandButton icon="pi pi-check" action="#{validarSolicitacaoCtrl.aprovar(item)}"
                                     process="@this" update="tabela :growl" title="Aprovar">
                        <p:confirm header="Aprovar solicitação" message="Ativar este cadastro?"
                                   icon="pi pi-question-circle"/>
                    </p:commandButton>
                    <p:commandButton icon="pi pi-times" action="#{validarSolicitacaoCtrl.recusar(item)}"
                                     process="@this" update="tabela :growl" styleClass="ui-button-danger"
                                     title="Recusar">
                        <p:confirm header="Recusar solicitação"
                                   message="Recusar exclui a solicitação e seus endereços. Continuar?"
                                   icon="pi pi-exclamation-triangle"/>
                    </p:commandButton>
                </p:column>
            </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>

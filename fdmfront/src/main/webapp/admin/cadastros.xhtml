<ui:composition template="/templates/Layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">

    <ui:define name="titulo">Cadastros</ui:define>

    <ui:define name="conteudo">
        <h1>Cadastros</h1>

        <h:form id="formLista">
            <p:commandButton value="Novo cadastro" icon="pi pi-plus" action="#{cadastroCtrl.novo}"
                             process="@this" update=":formDialogo" oncomplete="PF('dlgCadastro').show()"/>

            <p:dataTable id="tabela" value="#{cadastroCtrl.cadastros}" var="item" styleClass="fdm-filtros"
                         emptyMessage="Nenhum cadastro encontrado." paginator="true" rows="10">
                <p:column headerText="Id" style="width: 5rem">
                    <h:outputText value="#{item.id}"/>
                </p:column>
                <p:column headerText="Nome">
                    <h:outputText value="#{item.nomeCompleto}"/>
                </p:column>
                <p:column headerText="E-mail">
                    <h:outputText value="#{item.email}"/>
                </p:column>
                <p:column headerText="CPF">
                    <h:outputText value="#{item.cpf}"/>
                </p:column>
                <p:column headerText="Telefone">
                    <h:outputText value="#{item.telefone}"/>
                </p:column>
                <p:column headerText="Tipo" style="width: 7rem">
                    <h:outputText value="#{item.tipoCadastro}"/>
                </p:column>
                <p:column headerText="Ativo" style="width: 6rem">
                    <h:outputText value="#{item.ativo ? 'Sim' : 'Não'}"/>
                </p:column>
                <p:column headerText="Ações" style="width: 9rem; text-align: center">
                    <p:commandButton icon="pi pi-pencil" action="#{cadastroCtrl.editar(item)}"
                                     process="@this" update=":formDialogo" oncomplete="PF('dlgCadastro').show()"
                                     title="Editar"/>
                    <p:commandButton icon="pi pi-trash" action="#{cadastroCtrl.excluir(item)}"
                                     process="@this" update="tabela :growl" styleClass="ui-button-danger"
                                     title="Excluir">
                        <p:confirm header="Excluir cadastro" message="Deseja excluir este cadastro?"
                                   icon="pi pi-exclamation-triangle"/>
                    </p:commandButton>
                </p:column>
            </p:dataTable>
        </h:form>

        <h:form id="formDialogo" styleClass="fdm-formulario">
            <p:dialog widgetVar="dlgCadastro" visible="#{cadastroCtrl.exibirDialogo}" header="Cadastro" modal="true" responsive="true"
                      closeOnEscape="true" width="480">
                <p:ajax event="close" listener="#{cadastroCtrl.fecharDialogo}"/>
                <p:outputPanel id="painel" styleClass="ui-fluid">
                    <p:outputLabel for="nome" value="Nome completo"/>
                    <p:inputText id="nome" value="#{cadastroCtrl.cadastro.nomeCompleto}" required="true"
                                 requiredMessage="Informe o nome completo"/>
                    <p:message for="nome"/>

                    <p:outputLabel for="email" value="E-mail"/>
                    <p:inputText id="email" value="#{cadastroCtrl.cadastro.email}" required="true"
                                 requiredMessage="Informe o e-mail"/>
                    <p:message for="email"/>

                    <p:outputLabel for="cpf" value="CPF"/>
                    <p:inputMask id="cpf" value="#{cadastroCtrl.cadastro.cpf}" mask="999.999.999-99"
                                 required="true" requiredMessage="Informe o CPF"/>
                    <p:message for="cpf"/>

                    <p:outputLabel for="telefone" value="Telefone"/>
                    <p:inputMask id="telefone" value="#{cadastroCtrl.cadastro.telefone}"
                                 mask="(99) 99999-9999" required="true" requiredMessage="Informe o telefone"/>
                    <p:message for="telefone"/>

                    <p:outputLabel for="senha" value="Senha" rendered="#{cadastroCtrl.cadastro.id == null}"/>
                    <p:password id="senha" value="#{cadastroCtrl.cadastro.senha}"
                                rendered="#{cadastroCtrl.cadastro.id == null}"
                                required="true" requiredMessage="Informe a senha"/>
                    <p:message for="senha" rendered="#{cadastroCtrl.cadastro.id == null}"/>

                    <p:outputLabel for="tipo" value="Tipo"/>
                    <p:selectOneMenu id="tipo" value="#{cadastroCtrl.cadastro.tipoCadastro}">
                        <f:selectItems value="#{cadastroCtrl.tipos}"/>
                    </p:selectOneMenu>

                    <p:outputLabel for="ativo" value="Ativo"/><br/>
                    <p:toggleSwitch id="ativo" value="#{cadastroCtrl.cadastro.ativo}"/>
                </p:outputPanel>
                <f:facet name="footer">
                    <p:commandButton value="Salvar" icon="pi pi-check" action="#{cadastroCtrl.salvar}"
                                     update="painel :formLista:tabela :growl"/>
                </f:facet>
            </p:dialog>
        </h:form>
    </ui:define>
</ui:composition>

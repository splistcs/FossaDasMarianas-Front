<ui:composition template="/templates/Layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">

    <ui:define name="titulo">Meus pedidos</ui:define>

    <ui:define name="conteudo">
        <h1>Meus pedidos</h1>

        <p:outputPanel rendered="#{not sessaoCtrl.logado}">
            <p>Para ver seus pedidos, <h:link outcome="/login" value="entre na sua conta"/>.</p>
        </p:outputPanel>

        <h:form id="formPedidos" rendered="#{sessaoCtrl.logado}">
            <p:commandButton value="Atualizar" icon="pi pi-refresh" action="#{pedidoCtrl.carregar}"
                             process="@this" update="tabela" styleClass="ui-button-secondary"/>

            <p:dataTable id="tabela" value="#{pedidoCtrl.pedidos}" var="pedido" styleClass="fdm-filtros"
                         emptyMessage="Você ainda não tem pedidos." paginator="true" rows="10">
                <p:column style="width: 3rem">
                    <p:rowToggler/>
                </p:column>
                <p:column headerText="Pedido" style="width: 6rem">
                    <h:outputText value="N° #{pedido.id}"/>
                </p:column>
                <p:column headerText="Data">
                    <h:outputText value="#{pedido.dataFormatada}"/>
                </p:column>
                <p:column headerText="Status">
                    <h:outputText value="#{pedido.rotuloStatus}"/>
                </p:column>
                <p:column headerText="Total">
                    <h:outputText value="#{pedido.valorTotal != null ? pedido.valorTotal : pedido.totalItens}">
                        <f:convertNumber type="currency" locale="pt_BR"/>
                    </h:outputText>
                </p:column>
                <p:column headerText="Ações" style="width: 10rem; text-align: center">
                    <p:commandButton value="Avançar status" icon="pi pi-forward"
                                     action="#{pedidoCtrl.avancar(pedido)}" process="@this"
                                     update="tabela :growl" rendered="#{pedidoCtrl.podeAvancar(pedido)}"/>
                </p:column>
                <p:rowExpansion>
                    <p:dataTable value="#{pedido.itemPedido}" var="item">
                        <p:column headerText="SKU">
                            <h:outputText value="#{item.skuDto.codigoUniversal}"/>
                        </p:column>
                        <p:column headerText="Especificações">
                            <h:outputText value="#{item.skuDto.especificacoesVisiveis}"/>
                        </p:column>
                        <p:column headerText="Quantidade">
                            <h:outputText value="#{item.quantidade}"/>
                        </p:column>
                        <p:column headerText="Subtotal">
                            <h:outputText value="#{item.precoFinal}">
                                <f:convertNumber type="currency" locale="pt_BR"/>
                            </h:outputText>
                        </p:column>
                    </p:dataTable>
                </p:rowExpansion>
            </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
